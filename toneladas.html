<body data-page="toneladas">
<main id="contenido">
<section class="portada-pagina">
  <div class="contenedor">
    <p class="migas"><a href="index.html">Inicio</a> / Toneladas aprovechadas</p>
    <h1>Toneladas aprovechadas</h1>
    <p>Cuánto material recuperamos cada mes. Lo que se separa bien, se aprovecha.</p>
  </div>
  <svg class="ola" viewBox="0 0 1440 90" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="M0,42 C200,96 420,4 700,40 C960,74 1180,104 1440,48 L1440,90 L0,90 Z"/></svg>
